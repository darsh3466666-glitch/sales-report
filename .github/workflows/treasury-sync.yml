name: Treasury Auto Sync

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة خلال ساعات العمل (من 8 ص حتى 6 م بتوقيت مصر)
    - cron: '*/30 6-16 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت بضغطة زر

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Treasury Extraction
        run: |
          python scripts/sync_treasury_cloud.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/cashflow_data.json dist/cashflow_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'chore: auto-sync treasury data' && git push origin main)
          tree=$(git write-tree --prefix=dist/)
          commit=$(git commit-tree $tree -p origin/gh-pages -m "deploy: auto-sync treasury data")
          git push origin ${commit}:refs/heads/gh-pages
