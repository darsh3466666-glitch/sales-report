name: Treasury Auto Sync

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة خلال ساعات العمل (من 8 صباحاً حتى 6 مساءً بتوقيت مصر)
    - cron: '*/30 6-16 * * *'
  workflow_dispatch: # يتيح لك أيضاً تشغيله يدوياً بضغطة زر

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Treasury Extraction
        run: |
          python -c "
          import urllib.request, json
          # تحديث ومعالجة بيانات الخزينة مباشرة في الخلفية
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m 'chore: auto-sync treasury data' && git push)
